runConfig:
  minInstances: 1
  maxInstances: 30
  concurrency: 40
  cpu: 2
  memoryMiB: 2048

env:
  - variable: BUCKET
    value: int-zipcodetiles
    availability: [RUNTIME]
  - variable: COUNTY_OBJECT
    value: counties.mbtiles
    availability: [RUNTIME]
  - variable: COUNTY_LOCAL
    value: /tmp/counties.mbtiles
    availability: [RUNTIME]
  - variable: ZCTA_OBJECT
    value: zcta.mbtiles
    availability: [RUNTIME]
  - variable: ZCTA_LOCAL
    value: /tmp/zcta.mbtiles
    availability: [RUNTIME]
